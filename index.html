<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1c2c">
<title>로봇시티 규칙 수호대 : 만점왕의 비밀</title>
<link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
<style>
:root{--ink:#1a1c2c;--navy:#0b1736;--blue:#3b5bdb;--sky:#41a6f6;--yel:#ffd23f;--red:#e74c3c;--grn:#38b764;--pink:#ff6b9a;--wh:#f4f4f4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{height:100%;overflow:hidden;background:var(--ink);font-family:'Galmuri11','Galmuri9',monospace;color:var(--wh)}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
body.hurt #app{animation:hurt .35s}
@keyframes hurt{0%,100%{transform:none;filter:none}25%{transform:translate(-6px,2px);filter:sepia(1) saturate(5) hue-rotate(-50deg)}75%{transform:translate(6px,-2px)}}
.box{background:var(--navy);border:3px solid var(--wh);box-shadow:0 0 0 3px var(--ink),inset 0 0 0 3px #29366f;border-radius:4px}
.pbtn{background:var(--yel);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 22px;font-size:clamp(17px,2.2vw,22px);border-radius:2px}
.pbtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.pbtn:disabled{opacity:.45}
.pbtn.b{background:var(--sky)}.pbtn.g{background:var(--grn);color:#fff}.pbtn.r{background:var(--pink);color:#fff}.pbtn.w{background:var(--wh)}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* HUD */
#hud{display:none;flex:none;height:54px;align-items:center;gap:10px;padding:0 10px;background:var(--navy);border-bottom:3px solid var(--wh);z-index:5;font-size:16px}
#hud.on{display:flex}
.bar{position:relative;height:14px;background:#000;border:2px solid var(--wh);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .35s}
#hHp{width:110px}#hHp i{background:linear-gradient(#ff8a8a,var(--red))}
#hXp{width:64px}#hXp i{background:var(--yel)}
#hGoal{flex:1;text-align:center;color:var(--yel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb.on{background:var(--yel);color:var(--ink)}
.hb{border:2px solid var(--wh);padding:5px 9px;font-size:16px;background:#29366f}
#stage{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;display:none}.screen.on{display:flex}

/* Title */
#title{flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;background:linear-gradient(#0b1736 0%,#29366f 60%,#3b5bdb 100%)}
#title::before{content:'';position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:46px 46px;opacity:.35}
.tlogo{position:relative;font-family:'Galmuri14','Galmuri11',monospace;font-size:clamp(34px,6.4vw,66px);line-height:1.15;color:var(--yel);text-shadow:4px 4px 0 #b5541c,8px 8px 0 var(--ink)}
.tsub{position:relative;font-size:clamp(18px,2.8vw,28px);color:#fff;text-shadow:3px 3px 0 var(--ink)}
.tchars{position:relative;display:flex;gap:clamp(10px,3vw,30px);align-items:flex-end}
.tchars img{width:clamp(64px,9vw,104px);animation:bob 1s steps(2) infinite}
.tchars img:nth-child(2){animation-delay:.25s}.tchars img:nth-child(3){animation-delay:.5s}.tchars img:nth-child(4){animation-delay:.75s}
@keyframes bob{50%{transform:translateY(-6px)}}
.tinfo{position:relative;font-size:14px;color:#aab}
.credit{position:relative;font-size:clamp(16px,2vw,20px);color:var(--ink);background:var(--yel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:4px 14px}.credit:empty{display:none}

/* World */
#world{background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#dpad{position:absolute;left:14px;bottom:14px;display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px;z-index:6;opacity:.85}
#dpad button{background:#0b1736cc;border:3px solid var(--wh);font-size:24px;color:#fff;touch-action:none}
#dpad button:active{background:var(--sky)}
#dpad .c{visibility:hidden}

/* Dialog */
#dlg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(960px,96%);padding:12px 16px;display:none;gap:14px;z-index:20}
#dlg.on{display:flex}
.fastb{position:absolute;top:-16px;right:12px;background:var(--yel);color:var(--ink);border:3px solid var(--ink);font-size:14px;padding:2px 10px;z-index:2}
#dlgP{flex:none;width:clamp(64px,9vw,92px);height:clamp(64px,9vw,92px);background:#29366f;border:3px solid var(--wh)}
#dlgP img{width:100%;height:100%}
.dbody{flex:1;min-width:0}
#dlgN{font-size:15px;color:var(--yel);margin-bottom:4px}
#dlgT{font-size:clamp(18px,2.3vw,24px);line-height:1.5;word-break:keep-all;min-height:1.5em}
#dlg.tap{cursor:pointer}
#dlg.tap::after{content:'▼';position:absolute;right:14px;bottom:8px;color:var(--yel);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#dlgC{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ch{background:#29366f;border:3px solid #6b7fd7;padding:9px 12px;font-size:clamp(16px,2vw,20px);text-align:left;word-break:keep-all;color:#fff}
.ch::before{content:'▶ ';color:var(--yel)}
.ch.sel{background:#5a4a00;border-color:var(--yel)}
.ch.right{background:#1d6b3e;border-color:var(--grn)}
.ch.wrong{background:#6b1d2a;border-color:var(--red);opacity:.6;animation:shake .3s}
#dlgC .pbtn{align-self:center}
.fb{min-height:1.3em;font-size:clamp(15px,1.9vw,19px);color:#ffb3c7;margin-top:6px;word-break:keep-all}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Modal/toast */
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.on{display:flex}
.mbox{padding:20px 22px;text-align:center;width:min(640px,100%);max-height:90vh;overflow:auto}
.mbox h2{font-size:24px;color:var(--yel);margin-bottom:12px}
.mbox h3{font-size:17px;color:var(--sky);margin:12px 0 6px;text-align:left}
.mbox .pbtn{margin-top:14px}
.rcard{display:inline-flex;flex-direction:column;align-items:center;gap:6px;width:min(260px,84%);padding:16px 12px;background:#fff6d5;color:var(--ink);border:4px solid var(--ink);box-shadow:0 0 0 4px var(--yel),6px 6px 0 4px var(--ink);animation:flip .5s steps(5)}
@keyframes flip{from{transform:scaleX(0)}}
.rcard .ri{font-size:48px}.rcard .rn{font-size:22px}.rcard .rt{font-size:16px;word-break:keep-all}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.gi{background:#29366f;border:2px solid #6b7fd7;padding:8px;font-size:14px;word-break:keep-all}
.gi b{display:block;font-size:26px}.gi.no{opacity:.4}
.shopi{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#29366f;border:2px solid #6b7fd7;padding:6px 10px;margin-bottom:6px;font-size:16px;text-align:left}.shopi .pbtn{padding:4px 12px;font-size:15px;margin:0}.shopi small{color:#aab}
.ql{text-align:left;font-size:16px;line-height:1.7;word-break:keep-all}
#toast{position:fixed;top:66px;left:50%;transform:translate(-50%,-14px);padding:8px 16px;font-size:17px;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:normal;max-width:92vw;text-align:center;word-break:keep-all;background:var(--navy);border:3px solid var(--yel)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.pop{position:fixed;z-index:70;font-family:'Galmuri14',monospace;font-size:28px;color:var(--yel);text-shadow:3px 3px 0 var(--ink);pointer-events:none;animation:rise .9s steps(6) forwards}
.pop.big{font-size:40px;color:#fff;text-shadow:3px 3px 0 var(--red),6px 6px 0 var(--ink)}
@keyframes rise{to{transform:translateY(-60px);opacity:0}}

/* Minigames */
#mini{align-items:center;justify-content:center;padding:12px 12px 200px;background:repeating-linear-gradient(0deg,#1b2a55 0 8px,#1f3060 8px 16px)}
.mg{width:min(900px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:16px}
.mgt{font-size:clamp(19px,2.6vw,26px);color:var(--yel);word-break:keep-all}
.mgs{font-size:17px}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:min(440px,100%,calc(100vh - 400px))}
.fh{position:relative;aspect-ratio:1;background:#3e8948;border:3px solid var(--ink)}
.fh img{position:absolute;inset:6%;width:88%}
.fh .fl{display:none;animation:bob .3s steps(2) infinite}
.fh.on .fl{display:block}.fh.on{background:#a33}
.fh.saved{background:#3fbfff}
.igrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(620px,100%)}
.it{background:#29366f;border:3px solid #6b7fd7;padding:8px 4px;font-size:16px;display:flex;flex-direction:column;align-items:center;color:#fff}
.it span{font-size:clamp(32px,4.6vw,46px)}
.it.sel{border-color:var(--yel);background:#5a4a00}
.scan{display:flex;align-items:center;gap:20px;background:#29366f;border:3px solid #6b7fd7;padding:14px 22px}
.cargo{position:relative;width:110px}
.cargo img{width:100%}.cargo.stop{filter:sepia(1) saturate(4) hue-rotate(-40deg)}.cargo.go{transform:translateX(40px);opacity:.5;transition:.5s}
.slidein{animation:slidein .4s steps(6)}@keyframes slidein{from{transform:translateX(-120%)}}
.belt{width:100%;display:flex;justify-content:center;padding:10px 0;background:repeating-linear-gradient(90deg,#444 0 20px,#555 20px 40px);border-top:4px solid #222;border-bottom:4px solid #222}
.lbl{font-size:16px;margin-bottom:4px}.lbl.ai.ok{color:#8ff0a4}.lbl.ai.no{color:#ffb3b3}
.cargo.scanning::after{content:'';position:absolute;left:-8px;right:-8px;height:6px;background:#4ef;box-shadow:0 0 10px #4ef;animation:scan .75s steps(10)}
@keyframes scan{from{top:0}to{top:100%}}
.sres{font-size:clamp(18px,2.4vw,23px);max-width:360px;word-break:keep-all;color:#aab}
.sres.shown{color:#fff}
.hall{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;padding:12px;border:3px solid var(--wh);transition:background .3s}
.hall.on{background:#1d6b3e}.hall:not(.on){background:#6b1d2a;animation:shake .4s 2}
.hr{display:flex;gap:10px;align-items:center;background:var(--navy);border:2px solid #6b7fd7;padding:8px;text-align:left}
.hr img,.hr .em{width:48px;flex:none;font-size:34px;text-align:center}
.hr b{font-size:17px;color:var(--yel)}.hr p{font-size:16px;word-break:keep-all;margin-top:2px}
.hall.on .poff,.hall:not(.on) .pon{display:none}.hall:not(.on) .poff{color:#ffb3b3}
.sw{display:flex;align-items:center;gap:10px;background:#555;border:3px solid var(--ink);padding:6px 16px 6px 6px;font-size:19px;color:#fff;box-shadow:4px 4px 0 var(--ink)}
.sw i{width:38px;height:38px;background:#fff;border:3px solid var(--ink)}
.sw.on{background:var(--grn)}
.room{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.spot{background:#29366f;border:3px solid #6b7fd7;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;color:#fff;position:relative}
.spot img{width:64px}.spot .em{font-size:48px;line-height:64px}
.spot.found{border-color:var(--yel);background:#5a4a00}.spot.found::after{content:'❗';position:absolute;top:2px;right:6px}
.spot.empty{opacity:.5}
.clues{width:100%;text-align:left;font-size:16px;line-height:1.6;min-height:96px;padding:10px 12px;word-break:keep-all}
.clues li{list-style:none}.clues li::before{content:'🔎 '}
.duel{display:flex;align-items:flex-end;justify-content:space-around;width:100%}
.dside{display:flex;flex-direction:column;align-items:center;gap:6px;width:45%}
.dside img{width:clamp(80px,11vw,120px)}
.bub{background:#fff;color:var(--ink);border:3px solid var(--ink);padding:6px 10px;font-size:16px;min-height:2.4em;word-break:keep-all;width:100%}
.timer{width:100%;height:12px;border:2px solid var(--wh);background:#000}.timer i{display:block;height:100%;background:var(--yel)}
.dq{font-size:clamp(18px,2.3vw,22px);word-break:keep-all}
.dopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}

/* Battle */
#battle{flex-direction:column}
.field{position:relative;flex:1;min-height:0;overflow:hidden}
.field.city{background:linear-gradient(#41a6f6 0 55%,#38b764 55% 100%)}
.field.port{background:linear-gradient(#73eff7 0 55%,#257179 55% 100%)}
.field.exam{background:linear-gradient(#b8a0d8 0 55%,#8d6e4c 55% 100%)}
.field.grass{background:linear-gradient(#73eff7 0 55%,#3e8948 55% 100%)}
.field.tower{background:linear-gradient(#29104a 0 55%,#4b3b5c 55% 100%)}
.field::after{content:'';position:absolute;left:0;right:0;top:55%;height:8px;background:#0003}
.est{position:absolute;left:3%;top:5%;width:min(330px,44%);padding:8px 12px;z-index:2}
.pst{position:absolute;right:3%;bottom:6%;width:min(330px,44%);padding:8px 12px;z-index:2}
.est b,.pst b{font-size:17px}.est .bar,.pst .bar{height:16px;margin-top:6px}
.est .bar i{background:linear-gradient(#ff8a8a,var(--red))}.pst .bar i{background:linear-gradient(#8ff0a4,var(--grn))}
.pst small{font-size:14px}.pst .xpb{height:8px;margin-top:4px}.pst .xpb i{background:var(--yel)}
.enemy{position:absolute;right:12%;top:8%;width:clamp(140px,22vw,250px);transition:filter .1s}
.enemy.shield{filter:drop-shadow(0 0 0 #4ef) drop-shadow(0 0 10px #4ef)}
.enemy.flash{filter:brightness(4)}
.enemy.ko{transition:1s steps(6);transform:translateY(30px) scale(.6);opacity:0}
.enemy.hit{animation:shake .3s}
.ekey{margin-top:6px;font-size:15px;color:var(--ink);background:var(--yel);padding:3px 8px;border:2px solid var(--ink);word-break:keep-all}.ekey:empty{display:none}
.shtag{display:inline-block;margin-left:6px;color:#4ef;font-size:14px}
.party{position:absolute;left:8%;bottom:6%;display:flex;gap:6px;align-items:flex-end}
.party img{width:clamp(70px,10vw,112px);animation:bob 1s steps(2) infinite}
.party img+img{width:clamp(56px,8vw,90px)}
.bbot{flex:none;display:flex;gap:10px;padding:10px;background:var(--ink);min-height:150px}
#bLog{flex:1.3;padding:12px 14px;font-size:clamp(17px,2.1vw,21px);line-height:1.5;word-break:keep-all;position:relative}
#bLog.tap{cursor:pointer}#bLog.tap::after{content:'▼';position:absolute;right:10px;bottom:6px;color:var(--yel);animation:blink .6s steps(2) infinite}
#bCmd{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.cmd{background:var(--navy);border:3px solid var(--wh);padding:10px 6px;font-size:clamp(15px,1.9vw,19px);color:#fff;word-break:keep-all}
.cmd:active{background:var(--blue)}.cmd:disabled{opacity:.4}
.cmd.card{background:#fff6d5;color:var(--ink);border-color:var(--yel);text-align:left;padding:6px 8px;font-size:15px}
.cmd.full{grid-column:1/-1}
.cmd.q{text-align:left;font-size:clamp(14px,1.7vw,17px)}

.fh .fki{display:none;position:absolute;inset:6%;width:88%;animation:bob .3s steps(2) infinite}.fh.fk .fki{display:block}.fh.fk{background:#4b3b8a}
.fdesc{font-size:clamp(16px,2vw,19px);line-height:1.6;word-break:keep-all}
.stairs{position:relative;width:min(420px,90%);height:180px;background:linear-gradient(135deg,transparent 49%,#6b5a8a 49% 51%,transparent 51%),repeating-linear-gradient(0deg,#2b1b3d 0 30px,#4b3b5c 30px 36px);border:3px solid var(--wh)}
.climb{position:absolute;width:64px;left:5%;bottom:0;animation:climb 1.4s steps(7) forwards}@keyframes climb{to{left:78%;bottom:110px}}
.xm{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.xb{background:#29366f;border:3px solid #6b7fd7;padding:12px;text-align:left;color:#fff;display:flex;flex-direction:column;gap:4px}
.xb b{font-size:clamp(18px,2.2vw,22px);color:var(--yel)}.xb span{font-size:15px;word-break:keep-all}
.xb:active{background:var(--blue)}
body.enc #stage::after{content:'';position:absolute;inset:0;background:#fff;z-index:40;animation:enc .7s steps(1) forwards}
@keyframes enc{0%{opacity:1}20%{opacity:0}40%{opacity:1}60%{opacity:0}80%{opacity:1}100%{opacity:0}}
body[data-zone=stage] #mini{background:linear-gradient(90deg,#9b1c31 0 9%,transparent 9% 91%,#9b1c31 91%),linear-gradient(#24101c 0 78%,#8b5a2b 78%)}
body[data-zone=patrol] #mini{background:repeating-linear-gradient(0deg,#1d3366 0 3px,transparent 3px 44px),repeating-linear-gradient(90deg,#1d3366 0 3px,transparent 3px 64px),linear-gradient(#0b1736,#1f3d7a)}
body[data-zone=harbor] #mini{background:linear-gradient(#73c2ff 0 32%,#3b8fd6 32% 42%,transparent 42%),repeating-linear-gradient(0deg,#8b5a2b 0 22px,#6b4420 22px 24px)}
body[data-zone=exam] #mini{background:linear-gradient(#5a3a1e 0 3%,#2e5e3e 3% 68%,#5a3a1e 68% 72%,#d9c7a0 72%)}
body[data-zone=boss] #mini{background:radial-gradient(circle at 50% 30%,#4b2a7a,#12081f 70%)}
.fh .ov{position:absolute;inset:0;pointer-events:none}.fh .ov img{position:absolute;inset:6%;width:88%;animation:bob .3s steps(2) infinite}
.fh.s-fire{background:#a33}.fh.s-fake{background:#4b3b8a}.fh.s-big{background:#1e3a8a}.fh.s-spread{background:#c2551a;animation:pulse .45s steps(2) infinite}.fh.s-gold{background:#8a6d00}.fh.s-water{background:#1d6b8a}
.wt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(26px,4.6vw,42px);animation:bob .5s steps(2) infinite}
.hp3{position:absolute;right:3px;top:2px;background:#fff;color:var(--ink);border:2px solid var(--ink);font-size:14px;padding:0 4px;z-index:2}
@keyframes pulse{50%{filter:brightness(1.45)}}
.fbar{position:relative;width:min(560px,100%);height:34px;background:#3b8fd6;border:3px solid var(--wh)}.fz{position:absolute;top:0;bottom:0;width:20%;background:#38b764bb}.fc{position:absolute;top:0;bottom:0;width:4%;background:#ffd23f}
.fm{position:absolute;top:-7px;width:8px;height:42px;background:#ff5a5a;border:2px solid #fff;transform:translateX(-50%)}
.letter{background:#fff6d5;color:var(--ink);border:4px solid var(--ink);padding:16px 18px;text-align:left;font-size:17px;line-height:1.65;word-break:keep-all;animation:flip .5s steps(5)}.sig{text-align:right;margin-top:10px}
.otitle{text-align:center;font-size:16px;color:#8e44ad}
.fleg{font-size:15px;line-height:1.7;text-align:left;word-break:keep-all}
.tbar{grid-column:1/-1;position:relative;height:34px;background:#29366f;border:3px solid var(--wh)}.tz{position:absolute;top:0;bottom:0;width:20%;background:#38b764bb}.tc{position:absolute;top:0;bottom:0;width:4%;background:#ffd23f}.tm{position:absolute;top:-6px;width:8px;height:40px;background:#ff5a5a;border:2px solid #fff;transform:translateX(-50%)}
.cmd.ult{background:linear-gradient(90deg,#ff6b9a,#ffd23f);color:var(--ink);border-color:var(--yel)}.cmd.ult:disabled{background:var(--navy);color:#fff}
.cmd.tnow{background:var(--red);font-size:20px}
.eint{margin-top:6px;font-size:15px;color:#fff;background:#e74c3c;padding:3px 8px;border:2px solid var(--ink);word-break:keep-all;animation:blink .8s steps(2) infinite}.eint:empty{display:none}
.pst .gb{height:8px;margin-top:4px}.pst .gb i{background:linear-gradient(90deg,#ff6b9a,#ffd23f)}
.enemy.twin{filter:drop-shadow(-80px 12px 0 rgba(155,107,255,.85))}
.enemy.rage{filter:drop-shadow(0 0 14px #ff3b3b) hue-rotate(-40deg) saturate(1.6);transform:scale(1.12)}
.field.rage{background:linear-gradient(#5a0f1c 0 55%,#2b1b3d 55% 100%)!important}
/* Ending */

let AC;
function snd(t){if(!S||!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
 const q={ok:[[660,.07],[880,.12]],bad:[[200,.18]],win:[[523,.09],[659,.09],[784,.09],[1046,.25]],tap:[[600,.03]],lv:[[784,.07],[988,.07],[1175,.07],[1568,.2]],hit:[[180,.06],[120,.1]],enc:[[440,.06],[660,.06],[440,.06],[660,.06],[880,.14]],crit:[[880,.05],[1320,.05],[1760,.15]],coin:[[988,.05],[1319,.12]],heal:[[523,.06],[784,.12]]}[t];
 let k=AC.currentTime;q.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.06,k);g.gain.exponentialRampToValueAtTime(.001,k+d);o.connect(g).connect(AC.destination);o.start(k);o.stop(k+d+.02);k+=d});}catch(e){}}

function show(id){$$('.screen').forEach(s=>s.classList.toggle('on',s.id===id));hideDlg();if(id==='world'){resize();delete document.body.dataset.zone}}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2000)}
function pop(text,big,el){const e=document.createElement('div');e.className='pop'+(big?' big':'');e.textContent=text;let x=innerWidth/2,y=innerHeight*.3;if(el){const r=el.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height*.3}e.style.left=(x-40)+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),950)}
function hud(){$('#hHp i').style.width=clamp(S.hp/maxHP()*100,0,100)+'%';$('#hHpT').textContent=S.hp+'/'+maxHP();$('#hLv').textContent='Lv.'+lv();$('#hXp i').style.width=(S.xp%100)+'%';$('#hCoin').textContent='🪙 '+S.coins;$('#hSnd').textContent=S.sound?'🔊':'🔇';$('#hLook').classList.toggle('on',!!S.look);$('#hLook').textContent=S.look?'👆 살펴보기 ON':'👆 살펴보기';
 const n=nextZone();$('#hMenu').style.display=S.cleared.boss?'':'none';$('#hGoal').textContent=S.free?`📖 도감 ${Object.keys(MON).filter(k=>S.dex[k]).length}/${Object.keys(MON).length} · 풀숲을 탐험해요!`:n?'🎯 '+BZ[n].name:'🎯 모든 규칙을 되찾았다!'}
function addXP(n){const b=lv();S.xp+=n;pop('+'+n+' XP');const up=lv()-b;if(up>0){S.hp=maxHP();setTimeout(()=>{snd('lv');toast(`⭐ 레벨 업! Lv.${lv()} · 최대 HP·공격력 UP!`)},450)}hud();save();return up}
function heal(n){S.hp=Math.min(maxHP(),S.hp+n);snd('heal');hud();save()}
function qHurt(){if(!df().qh)return;S.hp=Math.max(1,S.hp-df().qh);hurtFx();hud();save()}
function hurtFx(){document.body.classList.add('hurt');setTimeout(()=>document.body.classList.remove('hurt'),350)}

function coin(n){n=Math.max(1,Math.round(n*df().coin));S.coins+=n;snd('coin');pop('+'+n+' 🪙');hud();save()}

function shadowBoss(fl){const b=ENEMY.boss,f=1+fl*.12;return {...b,final:false,name:`그림자 노룰 (${fl}층)`,hp:Math.round(80*f),weakDmg:Math.round(30*f),atk:[4+Math.floor(fl/4),7+Math.floor(fl/3)],xp:40,coin:40,noRun:true,
 intro:`🏯 ${fl}층의 주인, 그림자 노룰이 나타났다!`,win:'그림자 노룰이 연기처럼 사라졌다!',schemes:[...shuffle(b.schemes.filter(s=>s.weak)).slice(0,2),b.schemes[4]]}}
async function stairs(fl){show('mini');$('#mini').innerHTML=`<div class="mg box"><div class="mgt">🏯 ${fl}층으로 올라가는 중…</div><div class="stairs"><img class="climb" src="${url('hero',5)}"></div><div class="fdesc">${fl%5===0?'⚠️ 위층에서 무시무시한 기운이 느껴진다…':'계단 위에서 몬스터가 기다리고 있다!'}</div></div>`;snd('tap');await wait(1500)}
async function towerRun(){busy=true;S.hp=maxHP();let fl=1,best=0;
 await choice('🏯 무한의 탑','층마다 몬스터가 기다려요. HP가 0이 되면 도전이 끝나요!<br>한 층을 깰 때마다 HP가 조금 회복돼요. 5층마다 그림자 노룰이 나타나요.',['도전 시작! ▶']);
 while(true){if(fl>1)await stairs(fl);const ks=Object.keys(MON).filter(k=>k!=='gold');const E=fl%5===0?shadowBoss(fl):makeWild(ks[rand(0,ks.length-1)],fl);E.noRun=true;E.noRevive=true;
  const r=await battle(E);if(r.result!=='win')break;best=fl;await dropWeapon(fl%5===0?.6:.15,fl%5===0);if(E.key){S.dex[E.key]=(S.dex[E.key]||0)+1;await checkDex()}
  if(fl>(S.best.tower||0))S.best.tower=fl;if(fl>=10)badge('tower10');save();heal(Math.round(maxHP()*.3));
  const c=await choice(`🏯 ${fl}층 돌파!`,`HP ${S.hp}/${maxHP()} · 최고 기록 ${S.best.tower}층<br>다음 층으로 올라갈까?`,['⬆ 계속 올라가기','🏠 여기서 멈추기']);if(c!==0)break;fl++}
 S.hp=maxHP();save();await modal(`<h2>🏯 무한의 탑 결과</h2><div class="fdesc">이번 기록: <b style="color:var(--yel)">${best}층</b><br>최고 기록: ${S.best.tower}층</div>`);extraMenu()}
async function fireChallenge(){busy=true;const bf=S.best.fire;
 const m=await choice('🔥 화재 출동 챌린지',`${FLEG}<br>🎯 <b>미션 모드</b>: 30초 동안 최대한 많이! (최고 쉬움 ${bf[0]} · 보통 ${bf[1]} · 어려움 ${bf[2]})<br>🏆 <b>스테이지 모드</b>: 깰수록 어려워져요! (최고 ${S.best.fstage||0}스테이지)`,['🎯 미션 모드','🏆 스테이지 모드','↩ 돌아가기']);
 if(m===2)return extraMenu();if(m===1)return fireStageRun();
 const lv=await choice('🎯 미션 모드','난이도를 골라요. 어려울수록 새로운 불꽃이 많이 나와요!',['😊 쉬움','😐 보통','🔥 어려움','↩ 뒤로']);if(lv===3)return fireChallenge();
 const r=await fireRun({...MIS[lv],title:`🎯 미션 모드 · ${MIS[lv].n}`,goal:0});const nb=r.score>bf[lv];if(nb)bf[lv]=r.score;save();snd(nb?'win':'ok');
 const c=await choice(nb?'🎉 신기록!':'🚒 출동 완료',`${MIS[lv].n} 미션에서 불 ${r.score}곳을 껐어요. (최고 ${bf[lv]}곳)`,['🔁 한 번 더','🎮 메뉴로']);c===0?fireChallenge():extraMenu()}
async function fireStageRun(){let n=1;
 while(true){const F=stageCfg(n);await choice(`🏆 스테이지 ${n}`,`22초 안에 불 <b>${F.goal}곳</b>을 꺼요!${NEWF[n]?'<br><br>'+NEWF[n]:''}`,['출동! ▶']);
  const r=await fireRun(F);
  if(r.pass){coin(n*3);if(n>(S.best.fstage||0))S.best.fstage=n;save();snd('win');const c=await choice(`⭐ 스테이지 ${n} 클리어!`,`불 ${r.score}곳을 껐어요! 최고 기록 ${S.best.fstage}스테이지`,['다음 스테이지 ▶','🎮 메뉴로']);if(c===1)return extraMenu();n++}
  else{snd('bad');const c=await choice(`😢 스테이지 ${n} 실패`,`불 ${r.score}곳 / 목표 ${F.goal}곳<br>이번 기록: ${n-1}스테이지 · 최고 기록: ${S.best.fstage||0}스테이지`,['🔁 1스테이지부터 다시','🎮 메뉴로']);if(c===0){n=1;continue}return extraMenu()}}}
$('#hMenu').onclick=()=>{if(busy||!S.cleared.boss)return;snd('tap');extraMenu()};

/* =========== 가방 =========== */
$('#hBag').onclick=()=>{if(!S)return;snd('tap');const q=nextZone();
 const html=`<h2>🎒 가방</h2><h3>📜 퀘스트</h3><div class="ql">⭐ 메인: ${q?BZ[q].name+'에서 규칙 칩 되찾기':'완료!'}<br>📒 노트 할머니: ${S.gran===0?'(마을의 할머니에게 말을 걸어 봐요)':S.gran===1?`노력의 노트 찾기 ${S.notes}/3`:'완료!'}<br>🥚 이스터에그: ${Object.keys(S.eggs).length}/6 ${Object.keys(S.eggs).length<6?'(📋 광장의 소문 게시판을 읽어 봐요)':'완료!'}<br>🧩 규칙 칩 조각: ${S.pieces}/5${S.titles.length?'<br>🎖️ 칭호: '+S.titles.join(' · '):''}</div>
 <h3>📖 몬스터 도감 ${Object.keys(MON).filter(k=>S.dex[k]).length}/${Object.keys(MON).length} <button class="pbtn b" id="dexB" style="padding:3px 10px;font-size:14px">보기</button></h3><h3>⚔️ 무기 (공격력 ${atkStat()}) · ${df().i} ${df().n} 모드</h3><div class="glist">${S.weapons.map(w=>`<button class="gi" data-eq="${w}" style="color:#fff;${S.weapon===w?'border-color:var(--yel);background:#5a4a00':''}"><b>${WPN[w].i}</b>${WPN[w].n}<br><small style="color:${RAR[WPN[w].r][1]}">★${RAR[WPN[w].r][0]}</small> <small>+${WPN[w].atk} ${S.weapon===w?'· 장착 중':'· 눌러서 장착'}</small></button>`).join('')}</div><h3>🎒 아이템 · 🪙 ${S.coins}코인</h3><div class="ql">${Object.keys(ITM).map(k=>`${ITM[k].i} ${ITM[k].n} ${S.items[k]||0}개 <small>(${ITM[k].d})</small>${(k==='apple'||k==='lunch')&&S.items[k]>0&&S.hp<maxHP()?` <button class="pbtn g" data-eat="${k}" style="padding:3px 10px;font-size:14px">먹기</button>`:''}`).join('<br>')}</div>
 <h3>🃏 규칙 카드</h3><div class="glist">${Object.keys(CARDS).map(id=>S.cards.includes(id)?`<div class="gi"><b>${CARDS[id].icon}</b>${CARDS[id].name}</div>`:'<div class="gi no"><b>❔</b>???</div>').join('')}</div>
 <h3>🏅 배지</h3><div class="glist">${Object.keys(BADGES).map(id=>S.badges.includes(id)?`<div class="gi"><b>${BADGES[id][0]}</b>${BADGES[id][1]}</div>`:'<div class="gi no"><b>❔</b>???</div>').join('')}</div>`;
 modal(html,'닫기');document.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{S.weapon=b.dataset.eq;save();snd('ok');$('#modal').classList.remove('on');toast(`⚔️ ${WPN[S.weapon].n} 장착!`)});const dx=$('#dexB');if(dx)dx.onclick=()=>{$('#modal').classList.remove('on');dexView()};const e=$('#eat');document.querySelectorAll('[data-eat]').forEach(b=>b.onclick=()=>{const k=b.dataset.eat;S.items[k]--;heal(k==='apple'?15:999);$('#modal').classList.remove('on');toast(`${ITM[k].i} HP가 회복됐다!`)})};

/* =========== 시작 =========== */
function restart(){if(!confirm('처음부터 다시 할까요? 지금까지의 기록이 지워져요.'))return;try{localStorage.removeItem(KEY)}catch(e){}location.reload()}
async function startGame(){applySkin();$('#hud').classList.add('on');S.hp=Math.min(S.hp,maxHP());hud();if(S.cleared.boss&&!S.free){ending();return}
 P.x=P.fx=S.pos.x;P.y=P.fy=S.pos.y;C.x=C.fx=P.x;C.y=C.fy=P.y+1<MH&&passable(P.x,P.y+1)?P.y+1:P.y;Z.x=Z.fx=C.x;Z.y=Z.fy=C.y;lastPos={...S.pos};show('world');
 if(!S.intro){busy=true;await talk([['chip','안녕! 나는 수호대 도우미 로봇 칩이야.'],['chip','큰일이야! 노룰 박사가 로봇시티의 규칙 칩을 몽땅 훔쳐 갔어.'],['chip','그 뒤로 로봇들이 아무 명령이나 따르고, 시험장에선 이상한 만점자까지 나타났대.'],['chip','화면을 톡 누르거나 방향키로 움직여. 먼저 ▼ 표시가 있는 🎭 연극 무대로 가자!'],['chip','💡 길에 있는 상자와 사람들도 살펴봐. 숨은 보상이 있을지도!'],['chip','🌿 짙은 풀숲에서는 야생 몬스터가 튀어나와! 바른 답으로 설득해서 물리치자.'],['chip','💡 대사가 길면 오른쪽 위 ⏩ 빠르게 버튼을 눌러 봐. 키보드는 방향키나 WASD로 움직여!']]);S.intro=true;save();busy=false}}
initSprites();buildMap();bake();requestAnimationFrame(loop);
if(CREDIT)$('#credit').textContent='🛠️ 만든 사람 · '+CREDIT;
$('#tChars').innerHTML=['hero','chip','zero','noroul'].map(k=>`<img src="${url(k,6)}">`).join('');
S=load()||fresh();if(load()?.intro)$('#bCont').style.display='';
$('#bNew').onclick=async()=>{if($('#bCont').style.display===''&&!confirm('처음부터 새로 시작할까요? 이어하던 기록은 지워져요.'))return;S=fresh();snd('tap');const d=await choice('⚔️ 난이도를 골라요',DF.map(x=>`${x.i} <b>${x.n}</b> : ${x.d}`).join('<br>'),DF.map((x,i)=>`${x.i} ${x.n}${i===1?' (추천)':''}`));S.diff=d;save();fastLbl();toast(`${DF[d].i} ${DF[d].n} 모드로 시작해요!`);startGame()};
$('#bCont').onclick=()=>{S=load();fastLbl();snd('tap');startGame()};
$('#hSnd').onclick=()=>{S.sound=!S.sound;save();hud();snd('tap')};$('#hRe').onclick=restart;
const fastLbl=()=>$('#fastB').textContent=S&&S.fast?'▶ 보통 속도':'⏩ 빠르게';
$('#fastB').onclick=e=>{e.stopPropagation();if(!S)return;S.fast=!S.fast;save();fastLbl();finishType();snd('tap')};
if(document.fonts)document.fonts.ready.then(()=>{});
window.__G={QB,goto:z=>{const b=BZ[z];goTile(b.door,b.y+b.h)},walk:goTile,S:()=>S,idle:()=>!busy&&!P.moving&&!P.path.length&&!P.after};
